[project]
name = "starter"
version = "0.1.0"
description = "Hackathon starter: one FastAPI image, one store, one tool gateway, one agent loop."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
