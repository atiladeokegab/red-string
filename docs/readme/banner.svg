<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-label="Red String: pull the thread. A citation crawler that shows where the web's sources contradict each other.">
  <rect width="1280" height="340" fill="#14110f"/>
  <g font-family="Georgia, 'Iowan Old Style', Palatino, serif">
    <text x="72" y="150" fill="#efe9df" font-size="84" font-weight="600">Red String</text>
    <text x="74" y="204" fill="#efe9df" font-size="27">Pull the thread.</text>
    <text x="74" y="246" fill="#9a9185" font-size="21">A citation crawler that shows where the web's sources contradict each other.</text>
  </g>
  <rect x="72" y="64" width="46" height="3" fill="#e0312b"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <g transform="translate(760 78) rotate(-2)">
      <rect width="210" height="118" rx="2" fill="#f3ecdf"/>
      <text x="16" y="34" fill="#1d1a17" font-size="19" font-weight="700">7 Dec 2024</text>
      <text x="16" y="62" fill="#1d1a17" font-size="13" font-family="Georgia, serif">“concluded in a decision</text>
      <text x="16" y="80" fill="#1d1a17" font-size="13" font-family="Georgia, serif">filed on Saturday”</text>
      <text x="16" y="104" fill="#6b5f52" font-size="11">7 sources</text>
    </g>
    <g transform="translate(1020 150) rotate(1.5)">
      <rect width="210" height="118" rx="2" fill="#f3ecdf"/>
      <text x="16" y="34" fill="#1d1a17" font-size="19" font-weight="700">9 Dec 2024</text>
      <text x="16" y="62" fill="#1d1a17" font-size="13" font-family="Georgia, serif">“On 9 December 2024,</text>
      <text x="16" y="80" fill="#1d1a17" font-size="13" font-family="Georgia, serif">Gorman issued his decision.”</text>
      <text x="16" y="104" fill="#6b5f52" font-size="11">2 sources</text>
    </g>
  </g>
  <path d="M866 80 Q1010 190 1124 152" fill="none" stroke="#e0312b" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="866" cy="80" r="6" fill="#e0312b"/><circle cx="1124" cy="152" r="6" fill="#e0312b"/>
</svg>
